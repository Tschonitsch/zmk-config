# ---------- Config ----------

# -- Encoders --
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# -- Encoders --

# -- Oled --
#CONFIG_ZMK_DISPLAY=y
# -- Oled --

# -- LED --
CONFIG_ZMK_RGB_UNDERGLOW=y             # Enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240 # Set default color (blue)
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100 # Set color saturation
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50  # Set brightness
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0   # Set default effect
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y   # Turn LEDs on at startup
# -- LED --

# ---------- Config ----------
